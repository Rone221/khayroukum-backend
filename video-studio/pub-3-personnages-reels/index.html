<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Alif Académie — Le savoir qui vient à vous</title>
<style>
@font-face{font-family:Lora;font-weight:700;src:url(../shared/f/lora-latin-700-normal.woff2)}
@font-face{font-family:Lora;font-style:italic;font-weight:700;src:url(../shared/f/lora-latin-700-italic.woff2)}
@font-face{font-family:Cairo;font-weight:600;src:url(../shared/f/cairo-latin-600-normal.woff2)}
@font-face{font-family:Cairo;font-weight:700;src:url(../shared/f/cairo-latin-700-normal.woff2)}
@font-face{font-family:Cairo;font-weight:800;src:url(../shared/f/cairo-latin-800-normal.woff2)}
:root{--gold:#d4a93c;--gold2:#f0d27a;--cream:#f7f1e3;--g:#06301a;--ink:#0b3a1c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--g)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Cairo,sans-serif;color:var(--cream)}
#band{position:absolute;left:0;right:0;top:1380px;bottom:0;background:linear-gradient(180deg,#06301a,#041f11),url(../shared/a/bg_green.jpg);background-blend-mode:multiply}
#photo{position:absolute;left:0;top:0;width:1080px;height:1500px;overflow:hidden;z-index:0}
.shot{position:absolute;inset:0;opacity:0;overflow:hidden}
.shot img{position:absolute;left:50%;top:50%;transform-origin:center}
.shot img.blur{filter:blur(40px) brightness(.55) saturate(1.1)}
#fade{position:absolute;left:0;right:0;top:1060px;height:445px;background:linear-gradient(180deg,rgba(6,48,26,0),rgba(6,48,26,.75) 55%,#06301a)}
#topfade{position:absolute;left:0;right:0;top:0;height:260px;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0))}
#logo{position:absolute;right:38px;top:44px;width:150px;height:150px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.45))}
#kicker{position:absolute;left:0;right:0;top:1330px;text-align:center;font-weight:800;font-size:34px;letter-spacing:9px;color:var(--gold2);text-shadow:0 2px 10px rgba(0,0,0,.6)}
#kicker .line{display:block;width:120px;height:4px;margin:14px auto 0;background:var(--gold)}
#captions{position:absolute;left:50px;right:50px;top:1470px;height:260px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:62px;line-height:1.25;color:#fff}
#captions span{display:inline-block;margin:0 8px}
#captions span.on{color:var(--gold2)}
#tag{position:absolute;left:0;right:0;top:1480px;text-align:center;font-family:Lora;font-style:italic;font-weight:700;font-size:66px;line-height:1.3;color:var(--gold2);opacity:0}
#cta{position:absolute;left:0;right:0;top:1470px;text-align:center;opacity:0}
.wa{display:inline-flex;align-items:center;gap:24px;padding:22px 46px;border-radius:999px;background:#25d366;color:#fff;font-size:64px;font-weight:800;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.wa svg{width:80px;height:80px}
#end{position:absolute;inset:0;background:linear-gradient(180deg,#fbf6ea,#efe4c8);opacity:0;color:var(--ink);text-align:center}
#end .bgp{position:absolute;inset:0;background:url(../shared/a/bg_cream.jpg) center/cover;opacity:.55}
#bar{position:absolute;left:0;top:0;height:8px;background:linear-gradient(90deg,var(--gold),var(--gold2));z-index:9}
.e{position:absolute;left:0;right:0}
</style>
</head>
<body>
<div id="stage">
  <div id="band"></div>
  <div id="photo"></div>
  <div id="fade"></div>
  <div id="topfade"></div>
  <img id="logo" src="../shared/a/logo_white.png">
  <div id="kicker"></div>
  <div id="captions"></div>
  <div id="tag">Une vague de connaissances,<br>sur votre canapé.</div>
  <div id="cta"><div class="wa"><svg viewBox="0 0 64 64"><path d="M32 8C18.7 8 8 18.2 8 30.8c0 4.6 1.4 8.8 3.9 12.4L9 56l13.3-3.4c3 1.5 6.3 2.2 9.7 2.2 13.3 0 24-10.2 24-22.8S45.3 8 32 8z" fill="#fff"/><path d="M24 22c1-.6 2.2-.4 2.8.7l2.2 4.4c.4.9.2 1.9-.6 2.5l-1.4 1.1c1.6 3.2 4 5.6 7.2 7.2l1.1-1.4c.6-.8 1.6-1 2.5-.6l4.4 2.2c1.1.6 1.3 1.8.7 2.8-1.6 2.7-4.6 3.8-7.6 2.6-6.4-2.6-11.4-7.6-14-14-1.2-3 0-6 2.7-7.5z" fill="#25d366"/></svg><span id="num"></span></div>
    <div style="font-size:40px;font-weight:700;margin-top:30px">Faites le premier pas dès aujourd'hui</div></div>
  <div id="end"><div class="bgp"></div>
    <img class="e" id="e1" src="../shared/a/logo_green.png" style="left:360px;width:360px;height:360px;top:150px">
    <div class="e" id="e2" style="top:540px;font-family:Lora;font-weight:700;font-size:96px;letter-spacing:4px">ALIF ACADEMIE</div>
    <div class="e" id="e3" style="top:680px;font-family:Lora;font-style:italic;font-weight:700;font-size:56px;line-height:1.3;color:#8a6a12">« Vague de connaissances<br>sur votre canapé »</div>
    <div class="e" id="e4" style="top:900px"><div class="wa" style="font-size:58px"><svg viewBox="0 0 64 64"><path d="M32 8C18.7 8 8 18.2 8 30.8c0 4.6 1.4 8.8 3.9 12.4L9 56l13.3-3.4c3 1.5 6.3 2.2 9.7 2.2 13.3 0 24-10.2 24-22.8S45.3 8 32 8z" fill="#fff"/><path d="M24 22c1-.6 2.2-.4 2.8.7l2.2 4.4c.4.9.2 1.9-.6 2.5l-1.4 1.1c1.6 3.2 4 5.6 7.2 7.2l1.1-1.4c.6-.8 1.6-1 2.5-.6l4.4 2.2c1.1.6 1.3 1.8.7 2.8-1.6 2.7-4.6 3.8-7.6 2.6-6.4-2.6-11.4-7.6-14-14-1.2-3 0-6 2.7-7.5z" fill="#25d366"/></svg>+221 78 145 09 09</div></div>
    <div class="e" id="e5" style="top:1080px"><div style="display:inline-block;background:#fff;border-radius:30px;padding:26px;border:3px solid rgba(212,169,60,.6);box-shadow:0 18px 40px rgba(11,58,28,.2)"><img src="../shared/a/qr.png" style="width:300px;height:300px;display:block;image-rendering:pixelated"></div></div>
    <div class="e" id="e6" style="top:1460px;font-size:40px;font-weight:700;line-height:1.6">@alif_academie · alifacademie25@gmail.com<br><span style="color:#8a6a12">Cours à domicile à Dakar · en ligne partout</span></div>
  </div>
  <div id="bar"></div>
</div>
<script src="timeline.js"></script>
<script>
const SC = TL.scenes, $ = id => document.getElementById(id);
const cl = x => Math.max(0, Math.min(1, x));
const eo = x => 1 - Math.pow(1 - cl(x), 3);
const eio = x => { x = cl(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
const lerp = (a, b, p) => a + (b - a) * p;
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
function W(n, word, nth = 0) { const k = norm(word); let c = 0;
  for (const w of SC[n - 1].words) if (norm(w.w).startsWith(k)) { if (c++ === nth) return w.s; }
  return SC[n - 1].audioStart; }
const ST = n => SC[n - 1].start;

// plans : image, début, mouvement [zoom départ, zoom fin, déplacement x, y en px], mode, bandeau
const SHOTS = [
  ['p004_13', 0,                          [1.12, 1.0, 0, 30], 'cover', ''],
  ['p004_16', W(1, 'on') - .2,            [1.0, 1.1, -20, 0], 'cover', ''],
  ['p005_02', ST(2),                      [1.08, 1.0, 30, 0], 'cover', 'LE TRAVAIL'],
  ['p003_16', W(2, 'les') - .2,           [1.0, 1.08, 0, -20], 'cover', 'LE MANQUE DE TEMPS'],
  ['p004_17', ST(3),                      [1.0, 1.1, 0, 20], 'cover', ''],
  ['p003_06', W(3, 'le') - .2,            [1.12, 1.0, 0, 0], 'cover', ''],
  ['p003_04', ST(4),                      [1.0, 1.08, 20, 0], 'cover', 'À DOMICILE · DAKAR'],
  ['p004_03', W(4, 'rien') - .25,         [1.0, 1.06, 0, 0], 'contain', 'RIEN QUE POUR VOTRE ENFANT'],
  ['p005_04', W(4, 'ou') - .25,           [1.08, 1.0, 0, 0], 'cover', '… OU POUR VOUS'],
  ['p003_00', ST(5),                      [1.0, 1.08, 0, 0], 'cover', 'VOUS ÊTES LOIN ?'],
  ['p003_17', W(5, 'le') - .25,           [1.08, 1.0, -20, 0], 'cover', 'EN LIGNE'],
  ['p004_04', W(5, 'quel') - .25,         [1.0, 1.08, 0, 0], 'cover', 'DEPUIS N\'IMPORTE QUEL PAYS'],
  ['p004_08', ST(6),                      [1.1, 1.0, 0, 0], 'cover', 'LECTURE'],
  ['p004_01', W(6, 'tajwid') - .2,        [1.0, 1.08, 0, 0], 'cover', 'TAJWID'],
  ['p004_18', W(6, 'memorisation') - .2,  [1.08, 1.0, 0, 0], 'cover', 'MÉMORISATION'],
  ['p004_12', W(6, 'langue') - .2,        [1.0, 1.08, 0, 0], 'cover', 'LANGUE ARABE'],
  ['p004_06', W(6, 'un') - .2,            [1.08, 1.0, 0, 0], 'cover', 'À VOTRE RYTHME'],
  ['p003_14', ST(7),                      [1.0, 1.1, 0, -10], 'cover', ''],
  ['p004_11', ST(8),                      [1.0, 1.08, 0, 0], 'cover', ''],
].map(([img, t, kb, mode, label]) => ({ img, t, kb, mode, label }));
SHOTS.forEach((s, i) => s.end = i + 1 < SHOTS.length ? SHOTS[i + 1].t : TL.total);
const END = W(8, 'aujourd') + .9;   // carte finale

const photo = $('photo'), FW = 1080, FH = 1500;
SHOTS.forEach(s => {
  const d = document.createElement('div'); d.className = 'shot';
  if (s.mode === 'contain') { const b = new Image(); b.src = `img/${s.img}.jpg`; b.className = 'blur'; d.appendChild(b); s.blur = b; }
  const im = new Image(); im.src = `img/${s.img}.jpg`; d.appendChild(im); s.el = d; s.im = im; photo.appendChild(d);
});
function place(img, mode, z, dx, dy) {
  const w = img.naturalWidth, h = img.naturalHeight;
  const k = mode === 'contain' ? Math.min(FW / w, FH / h) : Math.max(FW / w, FH / h);
  img.style.width = w * k + 'px'; img.style.height = h * k + 'px';
  img.style.transform = `translate(-50%,-50%) translate(${dx}px,${dy}px) scale(${z})`;
}
// sous-titres
const chunks = SC.map(sc => { const out = []; let cur = [];
  sc.words.forEach((w, i) => { cur.push(i); const len = cur.map(j => sc.words[j].w).join(' ').length;
    if (/[.,:?!]$/.test(w.w) || len > 22) { out.push(cur); cur = []; } }); if (cur.length) out.push(cur); return out; });
let lastCap = '', lastKick = '';
function captions(t) { const el = $('captions'); let html = '', v = 0;
  SC.forEach((sc, n) => { if (n >= 6) return; chunks[n].forEach(ch => { const s = sc.words[ch[0]].s - .06, e = sc.words[ch[ch.length - 1]].e + .3;
    if (t >= s && t < e) { html = ch.map(j => `<span class="${t >= sc.words[j].s - .03 ? 'on' : ''}">${sc.words[j].w}</span>`).join(''); v = Math.min(cl((t - s) / .12), cl((e - t) / .15)); } }); });
  if (html !== lastCap) { el.innerHTML = html; lastCap = html; } el.style.opacity = v; el.style.transform = `translateY(${(1 - v) * 16}px)`; }

function render(t) {
  // plans photo : fondu enchaîné + mouvement lent
  SHOTS.forEach((s, i) => {
    const fin = i === 0 ? 1 : cl((t - s.t) / .45), on = t >= s.t - .01 && t < s.end + .46;
    s.el.style.display = on ? 'block' : 'none'; if (!on) return;
    s.el.style.opacity = fin; s.el.style.zIndex = i;
    const p = eio((t - s.t) / (s.end - s.t + .45)), [z0, z1, dx, dy] = s.kb;
    place(s.im, s.mode, lerp(z0, z1, p), dx * p, dy * p);
    if (s.blur) place(s.blur, 'cover', 1.1, 0, 0);
  });
  // bandeau de mots-clés
  const cur = SHOTS.filter(s => t >= s.t).pop();
  const k = $('kicker'), lab = cur ? cur.label : '';
  if (lab !== lastKick) { k.innerHTML = lab ? `${lab}<span class="line"></span>` : ''; lastKick = lab; }
  const kp = cur ? eo((t - cur.t - .1) / .5) : 0;
  k.style.opacity = lab ? kp * cl((cur.end + .1 - t) / .3) : 0; k.style.transform = `translateY(${(1 - kp) * 20}px)`;
  k.querySelector('.line') && (k.querySelector('.line').style.width = 120 * kp + 'px');
  captions(t);
  // slogan
  const tg = $('tag'), tp = eo((t - W(7, 'vague') + .25) / .7);
  tg.style.opacity = Math.min(tp, cl((ST(8) + .2 - t) / .4)); tg.style.transform = `translateY(${(1 - tp) * 25}px)`; tg.style.filter = `blur(${(1 - tp) * 6}px)`;
  // appel à l'action
  const cp = eo((t - W(8, 'ecrivez') + .3) / .6), c = $('cta');
  c.style.opacity = cp; c.style.transform = `translateY(${(1 - cp) * 30}px) scale(${lerp(.9, 1, cp)})`;
  const num = '+221 78 145 09 09', n = Math.floor(cl((t - W(8, 'ecrivez')) / 1.3) * num.length); $('num').textContent = num.slice(0, Math.max(n, 1));
  // carte finale
  const ep = eio((t - END) / .7), e = $('end'); e.style.opacity = ep; e.style.display = ep > 0 ? 'block' : 'none';
  [['e1', 0], ['e2', .25], ['e3', .45], ['e4', .7], ['e5', .9], ['e6', 1.1]].forEach(([id, d]) => {
    const q = eo((t - END - d) / .6), el = $(id); el.style.opacity = q; el.style.transform = `translateY(${(1 - q) * 30}px)`; });
  $('logo').style.opacity = 1 - ep;
  $('bar').style.width = cl(t / TL.total) * 1080 + 'px';
}
window.render = render;
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))])
  .then(() => Promise.all(SHOTS.flatMap(s => [s.im, s.blur].filter(Boolean).map(i => i.decode().catch(() => {})))))
  .then(() => render(0));
</script>
</body>
</html>
