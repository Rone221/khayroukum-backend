  // bandeau marque (haut)
  const bA = K(t, [[S.b, 0], [S.b + .6, 1], [S.g - .3, 1], [S.g, 0]]);

  const vg = ctx.createRadialGradient(W / 2, H / 2, 600, W / 2, H / 2, 1250); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.4)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  const fade = Math.max(K(t, [[0, 1], [.5, 0]]), K(t, [[TOTAL - .8, 0], [TOTAL, .6]])); if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}
